<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=600, height=600, user-scalable=no">
  <title>MRBD Three.js Cube</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 600px;
      height: 600px;
      overflow: hidden;
      background: #000000; /* 100% transparent on waveguide */
      color: #00FF88;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #hud {
      position: absolute;
      top: 18px;
      left: 18px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      pointer-events: none;
      line-height: 1.4;
    }
    canvas { display: block; width: 600px; height: 600px; }
  </style>
</head>
<body>
  <div id="hud">
    <div>MRBD CUBE // 30Hz</div>
    <div id="status" style="color: #00E5FF; font-size: 11px;">READY</div>
  </div>
  <canvas id="stage"></canvas>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
